<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn resin art — free tutorials &amp; workshops | The Epoxy Studio</title>
<meta name="description" content="Free resin art tutorials and hands-on workshops in Bengaluru from The Epoxy Studio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230A6A70'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="learn">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<section class="section section--night">
  <div class="wrap">
    <div class="head-row">
      <div><span class="kicker">Learn with the studio</span><h1 class="h2" style="color:#fff;font-size:clamp(36px,5vw,60px)">Free tutorials.</h1></div>
      <p style="color:#AEB7BE">Short, practical videos from our studio — from your first coaster to ocean waves.</p>
    </div>
    <div class="grid grid-3" id="lessons"></div>
  </div>
</section>

<section class="section" id="workshops">
  <div class="wrap split" style="align-items:flex-start">
    <div class="stack" style="gap:16px">
      <span class="kicker" style="margin:0">Hands-on, in Bengaluru</span>
      <h2 class="h2">Workshops</h2>
      <p class="lead">Small groups, all materials included, and you take home everything you make.</p>
      <div class="stack" id="events"></div>
    </div>
    <form class="panel stack" data-lead="workshop" data-success="Seat requested! We'll confirm on WhatsApp within a day." novalidate style="gap:16px">
      <h2 style="margin:0">Book a seat</h2>
      <div class="field"><label for="wsEvent">Workshop</label><select class="input" id="wsEvent" name="workshop" required></select></div>
      <div class="form-grid">
        <div class="field"><label for="wsName">Name</label><input class="input" id="wsName" name="name" required autocomplete="name"></div>
        <div class="field"><label for="wsPhone">Mobile number</label><input class="input" id="wsPhone" name="phone" type="tel" required autocomplete="tel"></div>
        <div class="field full"><label for="wsEmail">Email</label><input class="input" id="wsEmail" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="wsSeats">Seats</label><select class="input" id="wsSeats" name="seats"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      </div>
      <input class="hp" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-primary" type="submit" style="border-radius:12px">Request my seat</button>
      <p class="form-msg" role="status"></p>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="data/products.js"></script>
<script src="data/catalog.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* Edit tutorials and workshops here */
const LESSONS = [
  ["Start here", "Your first resin coaster in 20 minutes", "Mixing, pouring and demoulding — the basics done right.", ""],
  ["Fix a failed pour", "Sticky, bendy or cloudy? Six causes and fixes", "Work out what went wrong before your next pour.", ""],
  ["Technique", "Ocean waves with white pigment and a heat gun", "Cells, lacing and foam, step by step.", ""],
  ["Choose your resin", "Coating vs casting resin, explained", "Pick the right resin for the depth of your piece.", ""],
  ["Colour", "Mica, inks or pigment paste?", "How each colourant behaves in resin.", ""],
  ["Build bigger", "Planning your first river table", "Wood, moulds, sealing and the deep pour.", ""]
];
const EVENTS = [
  { name: "[Beginner resin art — coasters & trays]", date: "[Sat, 00 Month]", time: "[11 am – 2 pm]", price: "[₹ ____]", seats: "[__] seats left" },
  { name: "[Ocean waves on wood]", date: "[Sun, 00 Month]", time: "[11 am – 3 pm]", price: "[₹ ____]", seats: "[__] seats left" }
];
document.addEventListener("DOMContentLoaded", () => {
  $("#lessons").innerHTML = LESSONS.map(([tag, t, s, url]) => `<a class="lesson" href="${url || SITE.youtube}"><div class="media-wrap"><img class="media ar-169" src="${ph("#24313A", "Video thumbnail", 640, 360)}" alt="" loading="lazy"><span class="play">${ICON.play}</span></div><small>${tag}</small><strong class="h3" style="font-size:19px">${t}</strong><span>${s}</span></a>`).join("");
  $("#events").innerHTML = EVENTS.map((e) => `<div class="band band--light"><div><strong>${esc(e.name)}</strong><span class="muted">${esc(e.date)}, ${esc(e.time)} · ${esc(e.price)} · ${esc(e.seats)}</span></div></div>`).join("");
  $("#wsEvent").innerHTML = EVENTS.map((e) => `<option>${esc(e.name)} — ${esc(e.date)}</option>`).join("");
});
</script>
</body>
</html>

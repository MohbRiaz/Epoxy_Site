<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — The Epoxy Studio</title>
<meta name="description" content="Crystal-clear epoxy resin and art supplies from The Epoxy Studio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230A6A70'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <section class="section--tight" style="padding-top:24px">
    <div class="wrap" id="pdp"></div>
  </section>

  <section class="section section--white" id="detailsSec" hidden>
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="Product details" id="tabs"></div>
      <div id="tabPanels"></div>
    </div>
  </section>

  <section class="section" id="madeWith" hidden>
    <div class="wrap">
      <h2 class="h2" style="font-size:clamp(28px,3.4vw,40px);margin-bottom:24px">Made with this product</h2>
      <div class="grid grid-4">
        <img class="media ar-45 r-md" data-ph="#CFE3E6|Customer photo|500|625" alt="Customer artwork">
        <img class="media ar-45 r-md" data-ph="#E8DDCB|Customer photo|500|625" alt="Customer artwork">
        <img class="media ar-45 r-md" data-ph="#E6D6E4|Customer photo|500|625" alt="Customer artwork">
        <img class="media ar-45 r-md" data-ph="#D9E2D3|Customer photo|500|625" alt="Customer artwork">
      </div>
    </div>
  </section>

  <section class="section section--flush-top" id="relatedSec" hidden>
    <div class="wrap">
      <h2 class="h2" style="font-size:clamp(28px,3.4vw,40px);margin-bottom:24px">You might also need</h2>
      <div class="grid grid-4" id="related"></div>
    </div>
  </section>

  <div class="sticky-buy" id="stickyBuy"></div>
</main>

<div id="site-footer"></div>
<script src="data/products.js"></script>
<script src="data/catalog.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/product.js"></script>
</body>
</html>
